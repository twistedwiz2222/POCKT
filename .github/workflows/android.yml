name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # A stable debug key prevents "App not installed" when updating an APK
      # produced by a later clean GitHub runner.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pockt-debug-keystore-v1

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk POCKT-v0.2.0-debug.apk
          sha256sum POCKT-v0.2.0-debug.apk > POCKT-v0.2.0-debug.apk.sha256

      - name: Upload POCKT APK
        uses: actions/upload-artifact@v4
        with:
          name: POCKT-debug-apk
          path: |
            POCKT-v0.2.0-debug.apk
            POCKT-v0.2.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
